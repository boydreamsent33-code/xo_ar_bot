<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XO A&R Chat</title>
    <style>
      body { margin:0; font-family: Arial, sans-serif; }
      .top { padding:16px; }
      .top h2 { margin:0 0 6px; }
      .top p { margin:0; opacity:0.8; }
    </style>
  </head>
  <body>
    <div class="top">
      <h2>XO A&R</h2>
      <p>Chat with the A&R bot below.</p>
    </div>

    <!-- Botpress Webchat -->
<script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
<script src="https://files.bpcontent.cloud/2026/02/19/00/20260219005101-QHW35BIQ.js" defer></script>
    
    
  <!-- Speak replies (ElevenLabs TTS) -->
<script>
(() => {
  // prevent double init
  if (window.__bpTtsInstalled) return;
  window.__bpTtsInstalled = true;

  // Browsers block autoplay until user interacts once
  let canPlay = false;
  const enableAudio = () => { canPlay = true; };
  window.addEventListener("click", enableAudio, { once: true });
  window.addEventListener("keydown", enableAudio, { once: true });

  function getAudioSrc(tts) {
    if (!tts) return null;
    const url = tts.audioURL || tts.audioUrl || tts.url;
    if (url) return url;

    const b64 = tts.audioBase64 || tts.audiobase64;
    if (b64) return `data:audio/mpeg;base64,${b64}`;

    return null;
  }

  function playAudio(src) {
    if (!src || !canPlay) return;
    try {
      const audio = new Audio(src);
      audio.play().catch(() => {});
    } catch (e) {}
  }

  function handleMessage(evt) {
    // Botpress message object usually has metadata
    const msg = evt?.payload ?? evt;
    const tts = msg?.metadata?.tts || msg?.payload?.metadata?.tts;
    const src = getAudioSrc(tts);
    playAudio(src);
  }

  // Wait for Botpress webchat runtime
  const wait = setInterval(() => {
    if (window.botpress && typeof window.botpress.on === "function") {
      clearInterval(wait);
      window.botpress.on("message", handleMessage);
    }
  }, 100);

  setTimeout(() => clearInterval(wait), 15000);
})();
</script>
  </body>
  </html>
