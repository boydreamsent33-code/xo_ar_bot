<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XO A&R Chat</title>
    <style>
      body { margin:0; font-family: Arial, sans-serif; }
      .top { padding:16px; }
      .top h2 { margin:0 0 6px; }
      .top p { margin:0; opacity:0.8; }
    </style>
  </head>
  <body>
    <div class="top">
      <h2>XO A&R</h2>
      <p>Chat with the A&R bot below.</p>
    </div>

    <!-- Botpress Webchat -->
<script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
<script src="https://files.bpcontent.cloud/2026/02/19/00/20260219005101-QHW35BIQ.js" defer></script>
    
    
<script>
(() => {
  // browsers block autoplay until user interacts once
  let canPlay = false;
  const enable = () => { canPlay = true; };
  window.addEventListener("click", enable, { once: true });
  window.addEventListener("keydown", enable, { once: true });

  function getTts(msg){
    return msg?.payload?.metadata?.tts || msg?.metadata?.tts || msg?.payload?.tts || null;
  }

  function playFromTts(tts){
    if (!canPlay || !tts) return;
    const src =
      tts.audioUrl || tts.url ||
      (tts.audioBase64 || tts.audiobase64
        ? `data:audio/mpeg;base64,${tts.audioBase64 || tts.audiobase64}`
        : null);
    if (!src) return;
    const a = new Audio(src);
    a.play().catch(() => {});
  }

  function handle(evt){
    const msg = evt?.message || evt?.payload?.message || evt?.payload || evt;
    playFromTts(getTts(msg));
  }

  const attach = () => {
    if (window.botpressWebChat?.onEvent) {
      window.botpressWebChat.onEvent((e) => {
        if (e?.type === "MESSAGE_RECEIVED") handle(e?.value || e);
      }, ["MESSAGE_RECEIVED"]);
      return true;
    }
    if (window.botpress?.on) {
      window.botpress.on("message", handle);
      return true;
    }
    return false;
  };

  const t = setInterval(() => { if (attach()) clearInterval(t); }, 200);
  setTimeout(() => clearInterval(t), 15000);
})();
</script>
  </body>
  </html>
